# Настройки программы лабораторной работы «Предварительная обработка».
# Файл кладётся рядом с upo-lab1.jar. Кодировка UTF-8.
# Если файла нет, действуют значения по умолчанию.

# Пароль преподавателя. С ним открывается расчёт всех пунктов задания сразу,
# без входного контроля и рабочей тетради.
#
# Пароль вписывается открытым текстом (teacher.password = …); при первом
# запуске программа заменяет эту строку хэшем пароля (teacher.password.hash),
# из которого пароль восстановить нельзя. Встроенного пароля нет: если не
# задано ни то, ни другое, войти преподавателем нельзя. Сменить пароль можно
# кнопкой «Сменить пароль» в режиме преподавателя. Если пароль забыт –
# удалите строку teacher.password.hash и впишите teacher.password = новый
# пароль. Оценки в журнале обучающихся защищены паролем: при его смене или
# сбросе записи журнала становятся недействительными и удаляются.
teacher.password.hash = pbkdf2-sha256$120000$PVAGsMtYnxTLt/wRaIJRXQ==$5LXCMT0HkB8wmAemnQPrc5dJLgRyLOpGGWsOHYm8J4k=

# Способ вычисления динамической составляющей ошибки (столбцы ERD и EVD).
# Предусмотрен для сопоставления с прежней программой; на порядок работы
# обучающегося не влияет, меняются только числа в таблице.
#
#   anchor   – по руководству к работе: разность истинного значения
#              и значения аппроксимирующей функции в момент привязки
#              при отсутствии шумов измерений. Значение по умолчанию;
#
#   averaged – так, как считала прежняя программа: средняя квадратическая
#              невязка аппроксимации по всему интервалу усреднения,
#              от момента привязки не зависящая. Всё остальное считается
#              правильно, вычислительной погрешности прежней программы нет;
#
#   legacy   – воспроизведение прежней программы целиком: её разметка выборок,
#              средняя невязка вместо ошибки в момент привязки и вычисления
#              в одинарной точности. Отсюда и «полка», ниже которой прежняя
#              программа не опускалась при высоких степенях полинома.
#              Сверено с прогонами самой прежней программы: моменты времени,
#              число строк таблицы, случайные составляющие (ERS, EVS) и
#              независимость динамической ошибки от момента привязки совпадают
#              точно; сама «полка» при степени 2 и выше совпадает только по
#              порядку величины, так как определяется вычислительной
#              погрешностью фортрановских подпрограмм.
error.mode = anchor

# ---------------------------------------------------------------------------
# Момент привязки в пункте в) при автоматическом расчёте в режиме
# преподавателя. В этом пункте меняется объём выборки N, а момент привязки M0
# числом не закреплён. На работу обучающегося настройка не влияет: он задаёт
# режим обработки вручную сам. В режиме преподавателя это же значение
# выбирается списком «Привязка в пункте в)» на самом экране; при запуске
# в списке стоит то, что задано здесь.
#
#   middle – M0 переносится в середину выборки и меняется вместе с N
#            (значение по умолчанию, как предписывает руководство к работе:
#            иначе привязка осталась бы на краю расширяющегося интервала
#            усреднения и в исследуемую зависимость вмешалось бы влияние
#            второго параметра);
#
#   start  – M0 = 1: привязка остаётся в начале интервала усреднения при
#            любом N, как считала прежняя программа. Предусмотрено для
#            сопоставления с ней.
item.c.anchor = middle

# Вид главного окна.
#
#   true  – окно разворачивается на весь экран, поверх панели задач, без
#           рамки и системных кнопок (свернуть/развернуть/закрыть), размер
#           изменить нельзя. Завершить работу можно только кнопкой «Выход»
#           на самом экране программы. Значение по умолчанию: учебный
#           терминал, с которого нельзя случайно переключиться на рабочий
#           стол или свернуть его во время контрольной работы;
#
#   false – обычное окно: с заголовком и системными кнопками, сворачивается,
#           разворачивается, изменяется в размерах, закрывается и крестом,
#           и кнопкой «Выход» – с одним и тем же подтверждением, что
#           несохранённые результаты и записи тетради будут потеряны.
window.fullscreen = false

# Входной контроль знаний.
#
#   true  – после экрана приветствия обучающийся проходит контроль (пять
#           вопросов по теории, минимум три балла для допуска к работе), как
#           предусмотрено методикой. Полученная оценка попадает в шапку
#           отчёта. Значение по умолчанию;
#
#   false – экран контроля пропускается: обучающийся сразу переходит к вводу
#           исходных данных, в отчёте вместо оценки пишется, что контроль
#           не проводился. Режима преподавателя это не касается – у него
#           контроля нет в любом случае (см. README, раздел «Режим
#           преподавателя»): это отдельная роль для проверочного расчёта
#           всех пунктов задания сразу, а не способ пропустить контроль
#           обучающемуся.
test.enabled = true

# Журнал обучающихся (папка «БД» рядом с программой, запасное имя db).
#
#   true  – программа запоминает обучающегося, его оценку за входной
#           контроль (в зашифрованном виде) и всю работу: исходные данные,
#           рабочую тетрадь, выводы. После вылета или закрытия программы
#           при повторном входе контроль заново не проводится, работа
#           продолжается с того же места; получивший неудовлетворительную
#           оценку к контролю повторно не допускается, пока преподаватель
#           не удалит его запись («Журнал обучающихся» в режиме
#           преподавателя). Запись удаляется, когда все четыре пункта
#           выполнены, выводы записаны и отчёт сохранён, а также если она
#           не менялась больше 30 дней. Значение по умолчанию;
#
#   false – журнал не ведётся и не читается, всё как без него.
#
# Оценка шифруется ключом, полученным из пароля преподавателя: при смене
# пароля прежние записи журнала становятся недействительными и удаляются.
test.journal = true

# ---------------------------------------------------------------------------
# Перенос чисел из таблицы результатов в рабочую тетрадь мышью.
#
#   false – переноса нет (значение по умолчанию): числа обучающийся
#           переписывает в тетрадь сам, как переписывал бы их в тетрадь
#           на бумаге. В этом состоит исследовательская часть работы:
#           программа считает и рисует, а что выписать и что из этого
#           следует – решает обучающийся.
#
#   true  – в таблице результатов по щелчку правой кнопкой мыши появляется
#           меню: занести ERD, ERS и ER выбранной строки в таблицу пункта
#           задания а, б, в или г. Пункт выбирается вручную – один и тот же
#           режим обработки может относиться к разным пунктам; тот пункт,
#           которому заданный режим отвечает по закреплённым параметрам,
#           в меню выделен. Предусмотрено для занятий, где важно успеть
#           пройти все четыре пункта, и для показа работы преподавателем.
notebook.transfer = true

# ---------------------------------------------------------------------------
# Способ расчёта ошибок в режиме обработки «в момент привязки» (по умолчанию).
#
#   false – аналитический расчёт (значение по умолчанию, расчёт лабораторной
#           работы): динамическая ошибка – невязка аппроксимации истинной,
#           безошибочной траектории полиномом в момент привязки; случайная –
#           значение формулы раздела 4.2 руководства через корреляционную
#           матрицу ошибок оценивания. Датчик случайных чисел в расчёте
#           таблицы не участвует, и таблица строго воспроизводима.
#
#   true  – прямое статистическое моделирование (метод Монте-Карло) вместо
#           формул: для каждой строки таблицы проводится noise.trials
#           независимых опытов – измерения набираются датчиком случайных
#           чисел с заданным СКО, по ним методом наименьших квадратов
#           строится оценка, – а по накопленным опытам берутся среднее
#           (динамическая ошибка) и среднее квадратическое отклонение
#           (случайная ошибка). Проверено (класс MonteCarlo, папка
#           src/test), что результат при достаточном числе опытов совпадает
#           с аналитическим в пределах статистической погрешности
#           моделирования: ни то, ни другое не более «правильно», расчёт
#           лишь становится медленнее и зависимым от числа опытов.
#           Подробное обоснование – в записке «Аналитический расчёт
#           и метод Монте-Карло». На режимы «средняя по интервалу
#           усреднения» и «как в прежней программе» не действует.
noise.montecarlo = false

# Число независимых опытов на строку таблицы при noise.montecarlo = true.
# По умолчанию 20000 – доля секунды на строку, погрешность оценки случайной
# ошибки порядка 0,5 %. При нечисловом или неположительном значении
# принимается значение по умолчанию.
noise.trials = 20000
